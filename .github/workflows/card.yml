name: Card CI

on:
  push:
    branches: [main]
    paths:
      - "apps/card/**"
      - ".github/workflows/card.yml"
  pull_request:
    paths:
      - "apps/card/**"
      - ".github/workflows/card.yml"

defaults:
  run:
    working-directory: apps/card

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/card/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
