name: jaga PR Gate

on:
  workflow_call:
    inputs:
      fail-on:
        description: Ambang temuan baru yang memblokir
        required: false
        default: high
        type: string
      strict:
        description: Gagal workflow bila skor turun atau ada temuan baru
        required: false
        default: true
        type: boolean
    secrets:
      token:
        description: "Token untuk menulis komentar PR (default: github.token)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Pasang jaga
        run: |
          go install github.com/Emil-02/jaga/cmd/jaga@main
          go install github.com/Emil-02/jaga/cmd/jaga-diff@main
      - name: Pindai base dan head
        run: |
          jaga check base --format json -o base.json
          jaga check head --format json -o head.json
      - name: Buat ringkasan
        id: diff
        run: |
          jaga-diff base.json head.json --format markdown --fail-on "${{ inputs.fail-on }}" > diff.md
          cat diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Komentar PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.token || github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Gate
        if: ${{ inputs.strict }}
        run: jaga-diff base.json head.json --format text --fail-on "${{ inputs.fail-on }}" --strict
