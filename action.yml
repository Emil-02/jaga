name: jaga
description: Satu perintah untuk memeriksa secret, data pribadi, dan kesehatan repo sebelum deploy
author: Emil-02

inputs:
  path:
    description: Direktori yang diperiksa
    required: false
    default: .
  format:
    description: text | json | sarif | badge | html
    required: false
    default: text
  fail-on:
    description: low | medium | high | critical
    required: false
    default: high
  report:
    description: Tulis jaga-report.json ke direktori kerja
    required: false
    default: "false"
  badge:
    description: Tulis badge.svg ke direktori kerja
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Pasang jaga
      shell: bash
      run: go install github.com/Emil-02/jaga/cmd/jaga@latest
    - name: Jalankan pemeriksaan
      id: run
      shell: bash
      run: |
        set -o pipefail
        jaga check --format "${{ inputs.format }}" --ci --fail-on "${{ inputs.fail-on }}" "${{ inputs.path }}"
    - name: Tulis jaga-report.json
      if: inputs.report == 'true'
      shell: bash
      run: jaga check --format json --output jaga-report.json "${{ inputs.path }}"
    - name: Tulis badge.svg
      if: inputs.badge == 'true'
      shell: bash
      run: jaga check --format badge --output badge.svg "${{ inputs.path }}"
